  'delete-student': () => {
    const s = getStudent(S.studentId);
    confirmBox('Delete this student', `Everything for <b>${esc(fullName(s))}</b> goes — ${(s.entries || []).length} record entries, the curriculum checklist and the semester plan. This cannot be undone. Archiving keeps the record but hides it from the active list.`, 'Delete permanently', async () => {
      D().students = students().filter(x => x.id !== s.id);
      await save(); go('students'); toast('Deleted', 'good');
    }, 'danger');
  },
  'print': () => window.print(),
  'backup': async () => { await Vault.downloadBackup(); paintStatus(); toast('Backup downloaded', 'good'); },
  'restore': () => restoreFlow(),
  'import-xlsx': () => importXlsxFlow(),
  'import-onenote': () => oneNoteFlow(S.studentId),
  'export-csv': () => exportCsv(),
  'export-plain': () => exportPlain(),
  'file-new': async () => { try { await Vault.linkFile('save'); await Vault.writeFile(); paintStatus(); render(); toast('File linked — changes save straight to it', 'good'); } catch (e) { } },
  'file-open': async () => { try { await Vault.linkFile('open'); paintStatus(); render(); toast('File linked. Use “Load from it” to pull that copy in.', 'good'); } catch (e) { } },
  'file-write': async () => { const ok = await Vault.writeFile(); paintStatus(); render(); toast(ok ? 'Saved to the file' : 'Could not write to the file', ok ? 'good' : 'bad'); },
  'file-load': () => fileLoadFlow(),
  'file-unlink': async () => { await Vault.unlinkFile(); paintStatus(); render(); toast('Unlinked. Changes stay in this browser only.', 'good'); },
  'lock': () => lockUp(),
  'passcode': () => {
    modal({
      title: 'Change passcode',
      body: `<div class="fields">
        <div class="field wide"><label>Current passcode</label><input type="password" id="p-old"></div>
        <div class="field wide"><label>New passcode</label><input type="password" id="p-new"></div>
        <div class="field wide"><label>New passcode again</label><input type="password" id="p-new2"></div>
      </div><p class="hint" style="margin-top:10px">Backup files already written keep their old passcode. Write a fresh backup afterwards.</p>`,
      buttons: [{ label: 'Cancel' }, {
        label: 'Change it', kind: 'pri', onClick: async (bg, close) => {
          const a = $('#p-new', bg).value, b = $('#p-new2', bg).value;
          if (a.length < 6) return toast('Use at least 6 characters.', 'bad');
          if (a !== b) return toast('The two new passcodes do not match.', 'bad');
          try { await Vault.changePasscode($('#p-old', bg).value, a); close(); toast('Passcode changed', 'good'); }
          catch (e) { toast('The current passcode is wrong.', 'bad'); }
        }
      }],
    });
  },
  'wipe': () => {
    confirmBox('Erase everything on this machine', 'This deletes the encrypted database in this browser — every student, note and email. Backup files saved elsewhere are not touched. Download a backup first if you have any doubt.', 'Erase it', async () => {
      await IDB.del('vault'); await IDB.del('fileHandle'); await IDB.del('dirtyCount'); await IDB.del('lastBackup');
      location.reload();
    }, 'danger');
  },
  'toggle-archived': () => { S.showArchived = !S.showArchived; render(); },
  'clear-reg': () => {
    const list = students().filter(s => !s.archived);
    const n = list.filter(s => s.regMeetingDone || s.regVerified).length;
    if (!n) return toast('Both columns are already clear.');
    confirmBox('Clear both registration columns',
      `This unticks <b>Registration meeting complete</b> and <b>Course registration verified</b> for all ${list.length} active advisees — ${n} currently have at least one ticked. Nothing else on their records changes.`,
      'Clear them', async () => {
        list.forEach(s => { s.regMeetingDone = false; s.regVerified = false; });
        await save(); render(); toast('Both columns cleared', 'good');
      }, 'danger');
  },
};

/* ═══ EVENT WIRING ═══════════════════════════════════════ */
function wire() {
  document.addEventListener('click', async ev => {
    if (ev.target.matches('[data-chk],[data-slot],[data-gbdcourse]')) return;
    const t = ev.target.closest('[data-nav],[data-open],[data-act],[data-tab],[data-filter],[data-sort],[data-req],[data-reg],[data-gbd],[data-edit],[data-del],[data-expand],[data-toggle-done],[data-setpri],[data-clearflag],[data-resolve],[data-planadd],[data-planx],[data-pcx],[data-pchl],[data-elx],[data-elwic]');
    if (!t) return;
    const s = () => getStudent(S.studentId);

    if (t.dataset.nav) return go(t.dataset.nav);
    if (t.dataset.open) {
      const eid = t.dataset.entry;
      S.tab = 'record'; go('student', t.dataset.open);
      if (eid) { const el = document.getElementById('ev-' + eid); if (el) { el.scrollIntoView({ block: 'center' }); el.style.transition = 'background .5s'; } }
      return;
    }
    if (t.dataset.act) { ev.preventDefault(); return ACT[t.dataset.act] && ACT[t.dataset.act](); }
    if (t.dataset.tab) { S.tab = t.dataset.tab; return render(); }
    if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
    if (t.dataset.sort) { S.sort = t.dataset.sort; return render(); }
    if (t.dataset.expand) {
      const b = document.querySelector(`[data-body="${t.dataset.expand}"]`);
      b.classList.remove('ev-fold'); t.remove(); return;
    }
    if (t.dataset.req) {
      const st = s(); st.curriculum.done = st.curriculum.done || {}; st.curriculum.reg = st.curriculum.reg || {};
      if (st.curriculum.done[t.dataset.req]) delete st.curriculum.done[t.dataset.req];
      else { st.curriculum.done[t.dataset.req] = true; delete st.curriculum.reg[t.dataset.req]; }
      await save(); return render();
    }
    if (t.dataset.reg) {
      const st = s(); st.curriculum.reg = st.curriculum.reg || {};
      st.curriculum.reg[t.dataset.reg] ? delete st.curriculum.reg[t.dataset.reg] : st.curriculum.reg[t.dataset.reg] = true;
      await save(); return render();
    }
    if (t.dataset.gbd) {
      const st = s(); st.curriculum.gbd = st.curriculum.gbd || {};
      const g = st.curriculum.gbd[t.dataset.gbd] = st.curriculum.gbd[t.dataset.gbd] || {};
      g.done = !g.done; await save(); return render();
    }
    if (t.dataset.edit) return entryModal(s(), (s().entries || []).find(e => e.id === t.dataset.edit));
    if (t.dataset.del) {
      const e = (s().entries || []).find(x => x.id === t.dataset.del);
      return confirmBox('Delete this entry', `“${esc(e.title || typeLabel(e.type))}” from ${esc(fmtDate(e.date))} will be removed from the record.`, 'Delete', async () => {
        s().entries = s().entries.filter(x => x.id !== t.dataset.del); await save(); render();
      }, 'danger');
    }
    if (t.dataset.setpri) {
      const [eid, pri] = t.dataset.setpri.split(':');
      const e = (s().entries || []).find(x => x.id === eid);
      e.priority = pri; if (pri !== 'none') e.status = 'open';
      await save(); return render();
    }
    if (t.dataset.clearflag) {
      const [sid, key] = t.dataset.clearflag.split(':');
      const target = getStudent(sid);
      target[key] = key === 'otherFlag' ? '' : false;
      await save(); return render();
    }
    if (t.dataset.toggleDone) {
      const e = (s().entries || []).find(x => x.id === t.dataset.toggleDone);
      e.status = e.status === 'done' ? 'open' : 'done'; await save(); return render();
    }
    if (t.dataset.resolve) {
      const [sid, eid] = t.dataset.resolve.split(':');
      const e = (getStudent(sid).entries || []).find(x => x.id === eid);
      e.status = 'done'; await save(); return render();
    }
    if (t.dataset.planadd) { const st = s(); st.plan[+t.dataset.planadd].courses.push({ code: '', section: '', title: '', credits: '' }); await save(); return render(); }
    if (t.dataset.planx) {
      const i = +t.dataset.planx, st = s();
      return confirmBox('Remove semester', `“${esc(st.plan[i].label)}” and its courses go.`, 'Remove', async () => { st.plan.splice(i, 1); await save(); render(); }, 'danger');
    }
    if (t.dataset.pcx) { const [si, ci] = t.dataset.pcx.split(':').map(Number); s().plan[si].courses.splice(ci, 1); await save(); return render(); }
    if (t.dataset.pchl) { const [si, ci] = t.dataset.pchl.split(':').map(Number); const c = s().plan[si].courses[ci]; c.highlight = !c.highlight; await save(); return render(); }
    if (t.dataset.elx) { s().curriculum.electives.splice(+t.dataset.elx, 1); await save(); return render(); }
    if (t.dataset.elwic) { const e = s().curriculum.electives[+t.dataset.elwic]; e.wic = !e.wic; await save(); return render(); }
  });

  // field edits (debounced save)
  let sv;
  const queue = () => { clearTimeout(sv); sv = setTimeout(() => save(), 700); };
  document.addEventListener('input', ev => {
    const el = ev.target;
    const st = getStudent(S.studentId);
    if (el.id === 'search') { S.q = el.value.trim(); return render(); }
    if (el.dataset.slot && st) {
      st.curriculum.slots = st.curriculum.slots || {};
      st.curriculum.slots[el.dataset.slot] = el.value; return queue();
    }
    if (!st) return;
    if (el.dataset.sf) { st[el.dataset.sf] = el.dataset.bool ? !!el.value : el.value; return queue(); }
    if (el.dataset.plan) { const [i, k] = el.dataset.plan.split(':'); st.plan[+i][k] = el.value; return queue(); }
    if (el.dataset.pc) { const [i, j, k] = el.dataset.pc.split(':'); st.plan[+i].courses[+j][k] = el.value; return queue(); }
    if (el.dataset.el) { const [i, k] = el.dataset.el.split(':'); st.curriculum.electives[+i][k] = el.value; return queue(); }
    if (el.dataset.gbdcourse) {
      st.curriculum.gbd = st.curriculum.gbd || {};
      const g = st.curriculum.gbd[el.dataset.gbdcourse] = st.curriculum.gbd[el.dataset.gbdcourse] || {};
      g.course = el.value; return queue();
    }
  });
  document.addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset.chk) {
      const [sid, field] = el.dataset.chk.split(':');
      const target = getStudent(sid);
      if (target) { target[field] = el.checked; save(); paintRegCount(); }
      return;
    }
    if (el.dataset.f) { S[el.dataset.f] = el.value; return render(); }
    if (el.dataset.act === 'autolock') { D().settings.autoLockMin = +el.value; save(); resetIdle(); return; }
    const st = getStudent(S.studentId);
    if (st && el.dataset.sf) { st[el.dataset.sf] = el.dataset.bool ? !!el.value : el.value; save(); if (el.dataset.sf === 'program') render(); }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); $('#search').focus(); $('#search').select(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); ACT['backup'](); }
    if (e.key === 'Escape' && $('#rail').classList.contains('open')) window.dispatchEvent(new Event('close-rail'));
    if (e.key === 'Escape' && document.activeElement === $('#search')) { $('#search').value = ''; S.q = ''; render(); }
    resetIdle();
  });
  document.addEventListener('mousemove', resetIdle, { passive: true });
  const rail = () => $('#rail'), scrim = () => $('#scrim');
  const setRail = on => { rail().classList.toggle('open', on); scrim().classList.toggle('on', on); };
  $('#menu-btn').onclick = e => { e.stopPropagation(); setRail(!rail().classList.contains('open')); };
  scrim().onclick = () => setRail(false);
  $('#rail-close').onclick = () => setRail(false);
  rail().addEventListener('click', e => { if (e.target.closest('[data-nav],[data-act]')) setRail(false); });
  window.addEventListener('close-rail', () => setRail(false));
  window.addEventListener('vault-saved', paintStatus);
  window.addEventListener('beforeunload', e => {
    if (!Vault.fileLinked && Vault.dirty > 15) { e.preventDefault(); e.returnValue = ''; }
  });
}

function paintRegCount() {
  const el = document.querySelector('.filters .mono.sub');
  if (!el) return;
  const list = students().filter(s => S.showArchived ? s.archived : !s.archived);
  el.textContent = `${list.filter(x => x.regMeetingDone).length}/${list.length} met · ${list.filter(x => x.regVerified).length}/${list.length} verified`;
}

/* ═══ LOCK ═══════════════════════════════════════════════ */
function resetIdle() {
  clearTimeout(idleTimer);
  const mins = Vault.data ? (D().settings.autoLockMin || 30) : 0;
  if (!mins) return;
  idleTimer = setTimeout(() => lockUp(true), mins * 60000);
}
function lockUp(auto) {
  Vault.lock();
  $('#shell').classList.remove('on');
  $('#lock').style.display = 'flex';
  $('#pass').value = '';
  $('#lock-err').textContent = auto ? 'Locked after a spell of inactivity.' : '';
  setTimeout(() => $('#pass').focus(), 50);
}

/* Carries curriculum ticks across the template rebuild (trackers → full flowchart maps). */
async function migrate() {
  const d = Vault.data;
  if (!d || (d.schema || 1) >= 4) return;
  let moved = 0;
  const from = d.schema || 1;
  if (from < 2) d.students.forEach(s => {
    const legacy = (TPL[s.program] || {}).legacyIds || {};
    const done = (s.curriculum || {}).done || {};
    Object.keys(done).forEach(old => {
      if (legacy[old] && !done[legacy[old]]) { done[legacy[old]] = true; delete done[old]; moved++; }
    });
  });
  if (from < 3) {
    const split = { gen3b: 'gen3b-a', gen4a: 'gen4a-a' };
    d.students.filter(s => s.program === 'hsci').forEach(s => {
      const c = s.curriculum || {};
      ['done', 'reg', 'slots'].forEach(k => {
        const m = c[k]; if (!m) return;
        Object.keys(split).forEach(old => {
          if (m[old] !== undefined) { m[split[old]] = m[old]; delete m[old]; if (k === 'done') moved++; }
        });
      });
    });
  }
  if (from < 4) {
    // Health Sciences senior fall lost a duplicate GEN 3XX tile; fold its state onto the one that remains.
    d.students.filter(s => s.program === 'hsci').forEach(s => {
      const c = s.curriculum || {};
      ['done', 'reg'].forEach(k => {
        const m = c[k]; if (!m || m['gen4a-b'] === undefined) return;
        if (m['gen4a-a'] === undefined) { m['gen4a-a'] = m['gen4a-b']; if (k === 'done') moved++; }
        delete m['gen4a-b'];
      });
      if (c.slots && c.slots['gen4a-b'] !== undefined) {
        if (!c.slots['gen4a-a']) c.slots['gen4a-a'] = c.slots['gen4a-b'];
        delete c.slots['gen4a-b'];
      }
    });
  }
  d.schema = 4;
  await Vault.persist();
  if (moved) toast(`Curriculum updated — ${moved} tick${moved > 1 ? 's' : ''} carried over`, 'good');
}

async function boot() {
  let exists;
  try { exists = await Vault.exists(); }
  catch (err) {
    $('#lock-title').textContent = 'Storage is blocked';
    $('#lock-sub').textContent = 'Cannot start';
    $('#lock-form').style.display = 'none';
    $('#lock-note').innerHTML = `This browser will not let the page store anything, so there is nowhere to keep your records.
      That usually means the file was opened straight off the disk, or the browser is in private mode with site data switched off.
      Put the file on a web address you control and open it from there — a private GitHub Pages URL works, and your records still never leave this machine.`;
    return;
  }
  const lock = $('#lock');
  $('#lock-title').textContent = exists ? 'Advising Hub' : 'Set up your hub';
  $('#lock-sub').textContent = exists ? 'Locked' : 'First run on this machine';
  $('#pass').placeholder = exists ? 'Passcode' : 'Choose a passcode';
  $('#pass2').style.display = exists ? 'none' : '';
  $('#lock-go').textContent = exists ? 'Unlock' : 'Create the vault';
  $('#lock-note').innerHTML = exists
    ? `Records are encrypted on this machine. <strong>Anthropic, this browser's maker, and anyone else can't read them without this passcode</strong> — and there is no way to reset it.`
    : `Everything you enter is encrypted with this passcode and stored only in this browser. Nothing is uploaded. <strong>There is no reset and no recovery</strong> — if you lose the passcode, the records are gone. Write it down somewhere you'd keep a key.`;
  $('#lock-restore').style.display = exists ? 'none' : '';

  $('#lock-form').onsubmit = async ev => {
    ev.preventDefault();
    const p = $('#pass').value;
    $('#lock-err').textContent = '';
    try {
      if (exists) { await Vault.unlock(p); await migrate(); }
      else {
        if (p.length < 6) return $('#lock-err').textContent = 'Use at least 6 characters.';
        if (p !== $('#pass2').value) return $('#lock-err').textContent = 'The two entries do not match.';
        await Vault.create(p);
      }
    } catch (e) { return $('#lock-err').textContent = 'That passcode does not open this vault.'; }
    lock.style.display = 'none';
    $('#shell').classList.add('on');
    if (Vault.fileLinked) {
      const ok = await Vault.ensureFilePermission();
      if (!ok) toast('The linked file needs permission again — reconnect it under Backup & data.', 'bad');
    }
    paintStatus(); resetIdle(); go('dash');
  };
  let seedFile = null;
  $('#lock-restore').querySelector('button').onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.hub,.json,.txt,application/json,application/octet-stream,*/*';
    inp.onchange = () => {
      seedFile = inp.files[0]; if (!seedFile) return;
      $('#lock-sub').textContent = 'Restoring ' + seedFile.name;
      $('#pass').placeholder = 'Passcode that backup was made with';
      $('#pass2').style.display = 'none';
      $('#lock-go').textContent = 'Restore onto this machine';
      $('#lock-note').innerHTML = `The backup is decrypted here and re-encrypted into this browser under the same passcode. Nothing is uploaded.`;
      $('#lock-restore').style.display = 'none';
      $('#pass').focus();
    };
    inp.click();
  };
  const originalSubmit = $('#lock-form').onsubmit;
  $('#lock-form').onsubmit = async ev => {
    if (!seedFile) return originalSubmit(ev);
    ev.preventDefault();
    const p = $('#pass').value;
    $('#lock-err').textContent = '';
    try {
      const peek = JSON.parse(await seedFile.text());
      if (peek.app !== APP) throw new Error('not a hub backup');
      await Vault.create(p);
      const { payload, data } = await Vault.openBackup(seedFile, p);
      await Vault.replaceData(data, payload);
    } catch (e) {
      await IDB.del('vault');
      return $('#lock-err').textContent = 'That passcode does not open this backup.';
    }
    $('#lock').style.display = 'none';
    $('#shell').classList.add('on');
    paintStatus(); resetIdle(); go('dash');
    toast(`Restored ${students().length} students onto this machine`, 'good');
  };
  setTimeout(() => $('#pass').focus(), 60);
}

wire();
boot();
</script>
</body>
</html>
