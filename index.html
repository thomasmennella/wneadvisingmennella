<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Advising Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>:root{
  --ink:#151821; --ink-2:#1e222e; --ink-3:#2b3140;
  --paper:#faf9f6; --surface:#ffffff; --surface-2:#f2f1ec;
  --line:rgba(21,24,33,.10); --line-2:rgba(21,24,33,.18);
  --text:#171a21; --muted:#666b78; --faint:#9aa0ab;
  --accent:#1f4fd8; --accent-soft:#e8edfd;
  --urgent:#b4232a; --urgent-soft:#fbeaea;
  --watch:#a86400; --watch-soft:#fdf1dd;
  --ok:#11704b; --ok-soft:#e2f2ea;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --rail:212px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:#d5e0fb}

/* ══ Lock screen ══ */
.lock{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:900;padding:24px}
.lock-card{width:100%;max-width:380px;color:#e8e9ec}
.lock-mark{font-family:var(--serif);font-size:38px;line-height:1.05;letter-spacing:-.01em;color:#fff}
.lock-sub{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#8a90a0;margin-top:8px}
.lock form{margin-top:30px;display:flex;flex-direction:column;gap:10px}
.lock input{background:var(--ink-2);border:1px solid #333a4c;border-radius:6px;padding:11px 13px;color:#fff;font-family:var(--mono);font-size:13px}
.lock input::placeholder{color:#5d6474}
.lock .btn{background:var(--accent);color:#fff;border-radius:6px;padding:11px;font-weight:500}
.lock-note{font-size:12px;color:#767d8d;margin-top:18px;line-height:1.6}
.lock-note strong{color:#b9bfcc;font-weight:500}
.lock-err{color:#ff9a9a;font-size:12.5px;font-family:var(--mono);min-height:16px}
.lock-alt{margin-top:16px;font-size:12.5px;color:#8a90a0}
.lock-alt button{color:#b9bfcc;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}

/* ══ Shell ══ */
.shell{display:none;min-height:100vh}
.shell.on{display:block}
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--ink);color:#c7cbd4;display:flex;flex-direction:column;z-index:60}
.rail-top{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.rail-mark{font-family:var(--serif);font-size:21px;color:#fff;letter-spacing:-.01em}
.rail-mark span{color:#7d859a}
.rail-status{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#6d7488;margin-top:5px;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#3f8f6a;flex:none}
.dot.warn{background:#c98a00}
.dot.off{background:#5a6070}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:13px;color:#aeb4c2;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(255,255,255,.11);color:#fff}
.nav .n-count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#7d859a}
.nav button.on .n-count{color:#c7cbd4}
.nav .n-count.hot{color:#ff8b8b}

.rail-bottom{padding:10px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:6px}
.rail-bottom button{flex:1;font-size:11.5px;color:#aeb4c2;padding:7px;border-radius:5px;background:rgba(255,255,255,.06)}
.rail-bottom button:hover{background:rgba(255,255,255,.12);color:#fff}

.main{margin-left:var(--rail);min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,249,246,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 28px;display:flex;align-items:center;gap:12px}
.search-wrap{flex:1;max-width:520px;position:relative}
.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:8px 11px 8px 32px;font-size:13.5px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search-wrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line-2);border-radius:3px;padding:1px 4px}
.saved{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap}
.saved.dirty{color:var(--watch)}
.saved.stale{color:var(--urgent);font-weight:500}

.page{padding:26px 28px 90px;max-width:1180px}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:31px;font-weight:400;letter-spacing:-.015em;line-height:1.1}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h2{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:-.01em}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:10px;margin:26px 0 11px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-label:first-child{margin-top:0}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1a43ba}
.btn.danger{color:var(--urgent);border-color:#e8bcbc}
.btn.danger:hover{background:var(--urgent-soft);border-color:var(--urgent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ══ Cards / metrics ══ */
.grid{display:grid;gap:12px}
.metrics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 15px}
.metric .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.metric .v{font-family:var(--serif);font-size:31px;line-height:1.1;margin-top:5px}
.metric .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.metric.hot .v{color:var(--urgent)}
.metric.warm .v{color:var(--watch)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px}

/* ══ Tables ══ */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:400;padding:0 10px 7px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
.t-wrap{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.t-wrap table{margin:0}
.t-wrap th{padding-top:11px}
.t-wrap tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:12px}
.num{font-family:var(--mono);font-size:12.5px;text-align:right}
.name-cell{font-weight:500}
.sub{color:var(--muted);font-size:12px}

/* ══ Chips / flags ══ */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.urgent{background:var(--urgent-soft);color:var(--urgent)}
.chip.watch{background:var(--watch-soft);color:var(--watch)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.solid{background:var(--ink);color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ══ Student header ══ */
.rec-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.rec-name{font-family:var(--serif);font-size:38px;font-weight:400;line-height:1.05;letter-spacing:-.02em}
.rec-meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.tabs button{padding:10px 13px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.tabs .tcount{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:4px}

/* ══ Record spine (signature) ══ */
.spine{position:relative;padding-left:126px}
.spine::before{content:'';position:absolute;left:104px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.ev{position:relative;margin-bottom:14px}
.ev-date{position:absolute;left:-126px;width:96px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.35;padding-top:13px}
.ev-date .yr{display:block;color:var(--faint);font-size:10px}
.ev::before{content:'';position:absolute;left:-28px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.ev.p-urgent::before{border-color:var(--urgent);background:var(--urgent)}
.ev.p-watch::before{border-color:var(--watch);background:var(--watch)}
.ev.p-done::before{border-color:var(--ok);background:var(--ok)}
.ev-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 15px}
.ev.p-urgent .ev-card{border-left:3px solid var(--urgent)}
.ev.p-watch .ev-card{border-left:3px solid var(--watch)}
.ev-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.ev-title{font-weight:500;font-size:14px}
.ev-body{font-size:13.5px;line-height:1.62;color:#2c3038}
.ev-body p{margin:.45em 0}
.ev-body ul,.ev-body ol{margin:.45em 0 .45em 1.3em}
.ev-body table{margin:.6em 0;font-size:12.5px;border:1px solid var(--line)}
.ev-body td,.ev-body th{border:1px solid var(--line);padding:5px 8px}
.ev-body img{max-width:100%;border-radius:5px;margin:.4em 0}
.ev-body blockquote{border-left:2px solid var(--line-2);padding-left:11px;color:var(--muted);margin:.5em 0}
.ev-fold{max-height:190px;overflow:hidden;position:relative}
.ev-fold::after{content:'';position:absolute;inset:auto 0 0;height:52px;background:linear-gradient(transparent,var(--surface))}
.ev-more{font-size:12px;color:var(--accent);margin-top:6px}
.ev-act{display:flex;gap:9px;margin-top:9px;opacity:0;transition:opacity .12s}
.ev:hover .ev-act,.ev-act:focus-within{opacity:1}
.ev-act button{font-size:11.5px;color:var(--muted)}
.ev-act button:hover{color:var(--text);text-decoration:underline}
.ev-fields{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2)}
.ev-fields b{font-weight:500;color:var(--text)}

/* ══ Forms ══ */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;font-size:13.5px;background:var(--surface);width:100%}
.field textarea{resize:vertical;min-height:70px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.wide{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--muted)}

/* ══ Editor ══ */
.editor{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden}
.ed-bar{display:flex;gap:1px;padding:5px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.ed-bar button{padding:4px 8px;border-radius:4px;font-size:12.5px;color:var(--muted);min-width:28px}
.ed-bar button:hover{background:var(--surface);color:var(--text)}
.ed-bar b{font-weight:700}
.ed-bar .sep{width:1px;background:var(--line-2);margin:3px 4px}
.ed-area{min-height:150px;max-height:440px;overflow-y:auto;padding:11px 13px;font-size:13.5px;line-height:1.62}
.ed-area:focus{outline:none}
.ed-area:empty::before{content:attr(data-ph);color:var(--faint)}
.ed-area table{border:1px solid var(--line);font-size:12.5px}
.ed-area td,.ed-area th{border:1px solid var(--line);padding:5px 8px;min-width:44px}
.ed-area img{max-width:100%}
.ed-area ul,.ed-area ol{margin-left:1.3em}

/* ══ Curriculum ══ */
.prog{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:8px 0 5px}
.prog{position:relative}
.prog i,.prog u{display:block;height:100%;border-radius:4px;transition:width .3s;position:absolute;left:0;top:0}
.prog i{background:var(--accent)}
.prog u{background:var(--watch);opacity:.55}
.prog.done i{background:var(--ok)}
.yr-band{margin-bottom:20px}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px}
.creq{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;text-align:left;width:100%}
.creq:hover{border-color:var(--line-2)}
.creq.done{background:var(--ok-soft);border-color:#b9dcca}
.creq.reg{background:var(--watch-soft);border-color:#e6cfa0}
.creq-main{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%}
.creq-foot{display:flex;flex-direction:column;gap:5px;padding-top:6px;border-top:1px dashed var(--line-2)}
.creq-foot input{border:1px solid var(--line-2);border-radius:5px;padding:4px 7px;font-family:var(--mono);font-size:11.5px;width:100%;background:var(--surface)}
.creq-foot .mini{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.creq-foot .mini:hover{color:var(--text)}
.creq-foot .mini.on{color:var(--watch)}
.creq-foot .mini[disabled]{opacity:.35;cursor:not-allowed}
.minibox{width:13px;height:13px;border:1.5px solid var(--line-2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;flex:none}
.mini.on .minibox{background:var(--watch);border-color:var(--watch);color:#fff}
.creq.done .mini{color:var(--ok)}
.creq .box{width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:4px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center}
.creq.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.creq .cc{font-family:var(--mono);font-size:12px;font-weight:500}
.creq .cn{font-size:12px;color:var(--muted);line-height:1.35;margin-top:1px}
.creq .ct{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.gbd-grp{margin-bottom:14px}
.gbd-grp>.gl{font-size:12.5px;font-weight:500;margin-bottom:6px}
.gbd-grp>.gl span{font-family:var(--mono);font-size:10px;color:var(--faint);font-weight:400;text-transform:uppercase;letter-spacing:.06em;margin-left:7px}

/* ══ Plan ══ */
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px}
.plan-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.plan-head input{border:1px solid transparent;background:none;font-family:var(--serif);font-size:19px;padding:2px 5px;border-radius:5px;flex:1;min-width:0}
.plan-head input:hover{border-color:var(--line)}
.plan-head input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.plan-t input{border:1px solid transparent;background:none;padding:5px 7px;width:100%;border-radius:4px;font-size:13px}
.plan-t input:hover{background:var(--surface-2)}
.plan-t input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.plan-t td{padding:1px 2px}
.plan-t tr.hl input{background:#fff8cc}
.plan-t .cr-in{text-align:right;font-family:var(--mono);font-size:12.5px}
.plan-t .code-in{font-family:var(--mono);font-size:12.5px}
.plan-tot{display:flex;justify-content:flex-end;gap:10px;align-items:baseline;padding-top:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.plan-tot b{font-size:15px;color:var(--text)}
.x-btn{color:var(--faint);padding:3px 6px;font-size:15px;line-height:1;border-radius:4px}
.x-btn:hover{color:var(--urgent);background:var(--urgent-soft)}

/* ══ Drop zone ══ */
.drop{border:1.5px dashed var(--line-2);border-radius:9px;padding:22px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{display:block;font-size:14px;color:var(--text);font-weight:500;margin-bottom:3px}
.drop.over b{color:var(--accent)}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;margin:3px 4px 0 0}
.att a{color:var(--text);text-decoration:none}
.att a:hover{text-decoration:underline}

/* ══ Modal ══ */
.modal-bg{position:fixed;inset:0;background:rgba(18,20,27,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border-radius:12px;width:100%;max-width:660px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal.wide{max-width:960px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--surface)}
.modal-head h2{flex:1}
.modal-body{padding:20px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface)}

/* ══ Search results ══ */
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:7px}
.res:hover{border-color:var(--accent)}
.res-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.res-who{font-weight:500;font-size:13.5px}
.res-snip{font-size:12.5px;color:var(--muted);line-height:1.55}
.res-snip mark{background:#fff2a8;color:inherit;border-radius:2px;padding:0 1px}

/* ══ Toast ══ */
.toasts{position:fixed;bottom:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:8px;padding:10px 15px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.24);max-width:400px;animation:pop .2s ease}
.toast.bad{background:var(--urgent)}
.toast.good{background:var(--ok)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h3{font-family:var(--serif);font-size:21px;font-weight:400;color:var(--text);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:420px;margin:0 auto 14px}

.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line-2);border-radius:6px;padding:6px 9px;font-size:12.5px;background:var(--surface)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{padding:6px 11px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}

.scrim{display:none}

@media (max-width:860px){
  :root{--rail:0px}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(18,20,27,.42);z-index:55;backdrop-filter:blur(1px)}
  .rail.open .rail-top{padding-right:46px}
  .rail-close{display:flex !important}
  .rail{transform:translateX(-100%);transition:transform .2s;width:212px}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .main{margin-left:0}
  .page{padding:18px 15px 80px}
  .spine{padding-left:0}
  .spine::before{display:none}
  .ev::before{display:none}
  .ev-date{position:static;width:auto;text-align:left;padding:0 0 4px}
  .ev-date .yr{display:inline;margin-left:5px}
  .rec-name{font-size:29px}
  .menu-btn{display:block !important}
}
.menu-btn{display:none;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px}
.rail-close{display:none;position:absolute;top:14px;right:10px;width:30px;height:30px;align-items:center;justify-content:center;border-radius:6px;color:#aeb4c2;font-size:20px;line-height:1;z-index:2}
.rail-close:hover{background:rgba(255,255,255,.1);color:#fff}

@media print{
  .rail,.topbar,.tabs,.ev-act,.no-print,.btn{display:none !important}

  .page{padding:0;max-width:none}

<script>/* ═══════════════════════════════════════════════════════════
   Advising Hub — core: storage, crypto, sync, file parsers
   No network. No dependencies. Everything stays in this browser.
   ═══════════════════════════════════════════════════════════ */

const APP = 'advising-hub';
const APP_VER = 1;
const KDF_ITERS = 310000;

/* ─── tiny helpers ─────────────────────────────────────── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const b64e = buf => { let s = '', b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = str => { const s = atob(str), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
const stripHtml = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };

function fmtDate(d, style) {
  if (!d) return '';
  const t = typeof d === 'string' ? new Date(d + (d.length === 10 ? 'T12:00:00' : '')) : new Date(d);
  if (isNaN(t)) return String(d);
  if (style === 'long') return t.toLocaleDateString(undefined, { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' });
  if (style === 'time') return t.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  return t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
const today = () => new Date().toISOString().slice(0, 10);
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

/* ─── IndexedDB (raw records only; contents are ciphertext) ─── */
const IDB = (() => {
  let dbp;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(APP, 1);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), s = t.objectStore('kv');
      const req = fn(s);
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    get: k => tx('readonly', s => s.get(k)),
    set: (k, v) => tx('readwrite', s => s.put(v, k)),
    del: k => tx('readwrite', s => s.delete(k)),
  };
})();

/* ─── Crypto: passcode → AES-GCM ───────────────────────── */
const Crypt = {
  async deriveKey(pass, salt, iters) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iters || KDF_ITERS, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = new TextEncoder().encode(JSON.stringify(obj));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    return { iv: b64e(iv), ct: b64e(ct) };
  },
  async decrypt(key, iv, ct) {
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(iv) }, key, b64d(ct));
    return JSON.parse(new TextDecoder().decode(buf));
  },
};

/* ─── The vault ────────────────────────────────────────── */
const Vault = {
  key: null, data: null, meta: null,
  fileHandle: null, fileLinked: false,
  dirty: 0, lastSaved: null, lastBackup: null,
  deviceId: null,

  blank() {
    return {
      app: APP, schema: APP_VER,
      settings: { advisorName: '', autoLockMin: 30, termLabels: [] },
      students: [], templates: {},
      createdAt: new Date().toISOString(),
    };
  },

  async exists() { return !!(await IDB.get('vault')); },

  async create(pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    this.key = await Crypt.deriveKey(pass, salt);
    this.data = this.blank();
    this.deviceId = uid();
    this.meta = { salt: b64e(salt), iters: KDF_ITERS, rev: 1, deviceId: this.deviceId, device: navigator.platform || 'this machine', updatedAt: new Date().toISOString() };
    await this.persist();
    await IDB.set('deviceId', this.deviceId);
    return true;
  },

  async unlock(pass) {
    const rec = await IDB.get('vault');
    if (!rec) throw new Error('No vault on this machine.');
    const key = await Crypt.deriveKey(pass, b64d(rec.salt), rec.iters);
    this.data = await Crypt.decrypt(key, rec.iv, rec.ct); // throws on wrong passcode
    this.key = key;
    this.meta = { salt: rec.salt, iters: rec.iters, rev: rec.rev || 1, deviceId: rec.deviceId, device: rec.device, updatedAt: rec.updatedAt };
    this.deviceId = (await IDB.get('deviceId')) || rec.deviceId;
    this.lastBackup = await IDB.get('lastBackup');
    this.dirty = (await IDB.get('dirtyCount')) || 0;
    await this.restoreFileLink();
    return true;
  },

  async changePasscode(oldPass, newPass) {
    const rec = await IDB.get('vault');
    const oldKey = await Crypt.deriveKey(oldPass, b64d(rec.salt), rec.iters);
    await Crypt.decrypt(oldKey, rec.iv, rec.ct);
    const salt = crypto.getRandomValues(new Uint8Array(16));
    this.key = await Crypt.deriveKey(newPass, salt);
    this.meta.salt = b64e(salt); this.meta.iters = KDF_ITERS;
    await this.persist();
  },

  lock() { this.key = null; this.data = null; },

  async persist() {
    if (!this.key) return;
    this.meta.rev = (this.meta.rev || 0) + 1;
    this.meta.updatedAt = new Date().toISOString();
    this.meta.deviceId = this.deviceId;
    const { iv, ct } = await Crypt.encrypt(this.key, this.data);
    await IDB.set('vault', { ...this.meta, iv, ct, schema: APP_VER });
    this.lastSaved = new Date();
    this.dirty++;
    await IDB.set('dirtyCount', this.dirty);
    if (this.fileHandle) this.queueFileWrite();
  },

  /* ── optional direct-to-file sync (Chrome/Edge) ── */
  supportsFile() { return typeof window.showSaveFilePicker === 'function'; },

  async linkFile(mode) {
    let handle;
    if (mode === 'open') {
      [handle] = await window.showOpenFilePicker({
        types: [{ description: 'Advising Hub backup', accept: { 'application/json': ['.json', '.hub'] } }],
      });
    } else {
      handle = await window.showSaveFilePicker({
        suggestedName: 'advising-hub.hub.json',
        types: [{ description: 'Advising Hub backup', accept: { 'application/json': ['.json', '.hub'] } }],
      });
    }
    this.fileHandle = handle; this.fileLinked = true;
    await IDB.set('fileHandle', handle);
    return handle;
  },

  async unlinkFile() { this.fileHandle = null; this.fileLinked = false; await IDB.del('fileHandle'); },

  async restoreFileLink() {
    const h = await IDB.get('fileHandle');
    if (!h) return null;
    try {
      const perm = await h.queryPermission({ mode: 'readwrite' });
      this.fileHandle = h; this.fileLinked = true;
      return perm; // 'granted' | 'prompt' | 'denied'
    } catch (e) { return null; }
  },

  async ensureFilePermission() {
    if (!this.fileHandle) return false;
    let p = await this.fileHandle.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') p = await this.fileHandle.requestPermission({ mode: 'readwrite' });
    return p === 'granted';
  },

  queueFileWrite() {
    clearTimeout(this._fw);
    this._fw = setTimeout(() => this.writeFile().catch(e => console.warn('file write', e)), 1500);
  },

  async writeFile() {
    if (!this.fileHandle || !(await this.ensureFilePermission())) return false;
    const blob = await this.makeBackupBlob();
    const w = await this.fileHandle.createWritable();
    await w.write(blob); await w.close();
    this.dirty = 0; await IDB.set('dirtyCount', 0);
    this.lastBackup = new Date().toISOString();
    await IDB.set('lastBackup', this.lastBackup);
    window.dispatchEvent(new CustomEvent('vault-saved'));
    return true;
  },

  async readLinkedFile() {
    if (!this.fileHandle) return null;
    if (!(await this.ensureFilePermission())) return null;
    const f = await this.fileHandle.getFile();
    return JSON.parse(await f.text());
  },

  /* ── backup payload ── */
  async makeBackupBlob() {
    const { iv, ct } = await Crypt.encrypt(this.key, this.data);
    const payload = {
      app: APP, kind: 'encrypted-backup', schema: APP_VER,
      kdf: { salt: this.meta.salt, iters: this.meta.iters, hash: 'SHA-256' },
      rev: this.meta.rev, deviceId: this.deviceId, device: this.meta.device,
      updatedAt: this.meta.updatedAt, exportedAt: new Date().toISOString(),
      counts: { students: this.data.students.length, entries: this.data.students.reduce((n, s) => n + (s.entries || []).length, 0) },
      iv, ct,
    };
    return new Blob([JSON.stringify(payload)], { type: 'application/json' });
  },

  async downloadBackup() {
    const blob = await this.makeBackupBlob();
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
    download(blob, `advising-hub-${stamp}.hub.json`);
    this.dirty = 0; await IDB.set('dirtyCount', 0);
    this.lastBackup = new Date().toISOString();
    await IDB.set('lastBackup', this.lastBackup);
    window.dispatchEvent(new CustomEvent('vault-saved'));
  },

  async openBackup(file, pass) {
    const payload = JSON.parse(await file.text());
    if (payload.app !== APP) throw new Error('Not an Advising Hub backup file.');
    if (payload.kind === 'plain-export') return { payload, data: payload.data };
    const key = await Crypt.deriveKey(pass, b64d(payload.kdf.salt), payload.kdf.iters);
    const data = await Crypt.decrypt(key, payload.iv, payload.ct);
    return { payload, data };
  },

  async replaceData(data, sourceMeta) {
    this.data = data;
    if (sourceMeta && sourceMeta.rev) this.meta.rev = sourceMeta.rev;
    await this.persist();
  },
};

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

/* ═══ ZIP + XLSX reader (no libraries) ═══════════════════ */
async function unzip(arrayBuffer) {
  const dv = new DataView(arrayBuffer), u8 = new Uint8Array(arrayBuffer);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .xlsx file.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
    const lNameLen = dv.getUint16(lho + 26, true), lExtraLen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtraLen;
    files[name] = { method, bytes: u8.subarray(start, start + compSize) };
    p += 46 + nameLen + extraLen + cmtLen;
  }
  const out = {};
  for (const [name, f] of Object.entries(files)) {
    if (f.method === 0) { out[name] = new TextDecoder().decode(f.bytes); continue; }
    if (f.method !== 8) continue;
    if (typeof DecompressionStream !== 'function') throw new Error('This browser cannot read compressed .xlsx files. Use Chrome or Edge for the import.');
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([f.bytes]).stream().pipeThrough(ds);
    out[name] = await new Response(stream).text();
  }
  return out;
}

function colToNum(ref) {
  const m = /^([A-Z]+)/.exec(ref); if (!m) return 0;
  let n = 0; for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function excelDate(serial) {
  const ms = Math.round((serial - 25569) * 86400000);
  return new Date(ms).toISOString().slice(0, 10);
}

async function readXlsx(file) {
  const zip = await unzip(await file.arrayBuffer());
  const P = new DOMParser();
  const shared = [];
  if (zip['xl/sharedStrings.xml']) {
    const d = P.parseFromString(zip['xl/sharedStrings.xml'], 'application/xml');
    for (const si of d.getElementsByTagName('si')) {
      let s = '';
      for (const t of si.getElementsByTagName('t')) s += t.textContent;
      shared.push(s);
    }
  }
  // sheet name → target
  const wb = P.parseFromString(zip['xl/workbook.xml'], 'application/xml');
  const rels = P.parseFromString(zip['xl/_rels/workbook.xml.rels'] || '<x/>', 'application/xml');
  const relMap = {};
  for (const r of rels.getElementsByTagName('Relationship')) relMap[r.getAttribute('Id')] = r.getAttribute('Target');
  // date-formatted style ids
  const dateStyles = new Set();
  if (zip['xl/styles.xml']) {
    const st = P.parseFromString(zip['xl/styles.xml'], 'application/xml');
    const customDate = new Set();
    for (const nf of st.getElementsByTagName('numFmt')) {
      const code = nf.getAttribute('formatCode') || '';
      if (/[dmy]/i.test(code) && !/[#0]/.test(code.replace(/\[[^\]]*\]/g, ''))) customDate.add(nf.getAttribute('numFmtId'));
    }
    const xfs = st.getElementsByTagName('cellXfs')[0];
    if (xfs) Array.from(xfs.getElementsByTagName('xf')).forEach((xf, i) => {
      const id = xf.getAttribute('numFmtId');
      if (customDate.has(id) || (+id >= 14 && +id <= 22) || (+id >= 45 && +id <= 47)) dateStyles.add(i);
    });
  }
  const sheets = [];
  for (const sh of wb.getElementsByTagName('sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = relMap[rid] || '';
    if (target.startsWith('/')) target = target.slice(1); else if (!target.startsWith('xl/')) target = 'xl/' + target;
    const xml = zip[target]; if (!xml) continue;
    const d = P.parseFromString(xml, 'application/xml');
    const rows = [];
    for (const row of d.getElementsByTagName('row')) {
      const cells = [];
      for (const c of row.getElementsByTagName('c')) {
        const idx = colToNum(c.getAttribute('r') || 'A1');
        const t = c.getAttribute('t');
        const sIdx = c.getAttribute('s');
        const isEl = c.getElementsByTagName('is')[0];
        const vEl = c.getElementsByTagName('v')[0];
        let val = '';
        if (t === 's' && vEl) val = shared[+vEl.textContent] || '';
        else if (t === 'inlineStr' && isEl) val = isEl.textContent;
        else if (vEl) {
          val = vEl.textContent;
          if (t !== 'str' && sIdx != null && dateStyles.has(+sIdx) && val !== '' && !isNaN(+val)) val = excelDate(+val);
        }
        cells[idx] = String(val).trim();
      }
      for (let i = 0; i < cells.length; i++) if (cells[i] === undefined) cells[i] = '';
      rows.push(cells);
    }
    sheets.push({ name: sh.getAttribute('name'), rows });
  }
  return sheets;
}

/* ═══ Email parsing ══════════════════════════════════════ */
function decodeQP(s) {
  return s.replace(/=\r?\n/g, '').replace(/=([0-9A-Fa-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
}
function decodeMimeWords(s) {
  return String(s || '').replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m, cs, enc, txt) => {
    try {
      let bytes;
      if (enc.toUpperCase() === 'B') bytes = b64d(txt);
      else { const t = txt.replace(/_/g, ' '); const d = decodeQP(t); bytes = new Uint8Array([...d].map(c => c.charCodeAt(0))); }
      return new TextDecoder(cs.toLowerCase().replace('windows-', 'windows-')).decode(bytes);
    } catch (e) { return m; }
  });
}
function utf8From(str) { try { return new TextDecoder('utf-8').decode(new Uint8Array([...str].map(c => c.charCodeAt(0) & 0xff))); } catch (e) { return str; } }

function parseEml(text) {
  const parts = splitMime(text);
  const h = parts.headers;
  const out = {
    from: decodeMimeWords(h['from'] || ''),

/* ─── toast ─────────────────────────────────────────────── */
function toast(msg, kind) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, kind === 'bad' ? 6000 : 3200);
}

/* ─── modal ─────────────────────────────────────────────── */
function modal(opts) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal${opts.wide ? ' wide' : ''}">
    <div class="modal-head"><h2>${esc(opts.title)}</h2><button class="x-btn" data-x>&times;</button></div>
    <div class="modal-body"></div>
    <div class="modal-foot"></div></div>`;
  $('.modal-body', bg).innerHTML = opts.body || '';
  const foot = $('.modal-foot', bg);
  (opts.buttons || []).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.kind ? ' ' + b.kind : '');
    el.textContent = b.label;
    el.onclick = () => b.onClick ? b.onClick(bg, close) : close();
    foot.appendChild(el);
  });
  function close() { bg.remove(); document.removeEventListener('keydown', key); }
  function key(e) { if (e.key === 'Escape') close(); }
  bg.querySelector('[data-x]').onclick = close;
  bg.onclick = e => { if (e.target === bg && !opts.sticky) close(); };
  document.addEventListener('keydown', key);
  document.body.appendChild(bg);
  if (opts.onOpen) opts.onOpen(bg, close);
  const f = bg.querySelector('input,textarea,select');
  if (f) f.focus();
  return { el: bg, close };
}
function confirmBox(title, msg, okLabel, onOk, kind) {
  modal({
    title, body: `<p style="font-size:13.5px;line-height:1.6">${msg}</p>`,
    buttons: [{ label: 'Cancel' }, { label: okLabel, kind: kind || 'pri', onClick: (bg, close) => { close(); onOk(); } }],
  });
}

/* ─── data helpers ──────────────────────────────────────── */
const D = () => Vault.data;
const students = () => D().students;
const getStudent = id => students().find(s => s.id === id);
const fullName = s => `${s.first || ''} ${s.last || ''}`.trim() || '(unnamed)';
const sortName = s => `${(s.last || '').toLowerCase()} ${(s.first || '').toLowerCase()}`;

function newStudent(f) {
  return Object.assign({
    id: uid(), last: '', first: '', sid: '', classYear: '', program: '', track: '',
    careerAmbition: '', preferredEmail: '', creditsEarned: '', creditsRemaining: '',
    auditStatus: '', planLastThree: '', oneNoteLink: '', worksheetsDir: '', generalNotes: '',
    registrationHold: false, academicConcern: false, scholarshipCheck: false, otherFlag: '',
    archived: false, curriculum: { done: {}, gbd: {}, electives: [] }, plan: [], entries: [],
    createdAt: new Date().toISOString(),
  }, f || {});
}
function entries(s, type) {
  const list = (s.entries || []).slice();
  return (type && type !== 'all' ? list.filter(e => e.type === type) : list)
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
}
function entryTone(e) {
  if (e.priority === 'urgent') return 'urgent';
  if (e.priority === 'watch') return 'watch';
  return e.type === 'flag' ? 'watch' : '';
}
function openItems(s) {
  return (s.entries || []).filter(e => e.status !== 'done' && entryTone(e));
}
/* Flagged rows = unresolved flag/priority entries + the standing flags on the profile. */
function flagRows(list) {
  const rows = [];
  list.forEach(s => {
    openItems(s).forEach(e => rows.push({
      s, e, tone: entryTone(e), label: e.title || stripHtml(e.body).slice(0, 70) || '(untitled)',
      kind: typeLabel(e.type), due: e.dueDate || '', logged: e.date || '',
    }));
    studentFlags(s).forEach(f => rows.push({
      s, sf: f.key, tone: f.k, label: f.t, kind: 'Standing flag', due: '', logged: '',
    }));
  });
  return rows.sort((a, b) => (a.tone === 'urgent' ? 0 : 1) - (b.tone === 'urgent' ? 0 : 1)
    || (a.due || '9999').localeCompare(b.due || '9999')
    || sortName(a.s).localeCompare(sortName(b.s)));
}
function lastMeeting(s) {
  const m = entries(s, 'meeting')[0];
  return m ? m.date : null;
}
function studentFlags(s) {
  const f = [];
  if (s.registrationHold) f.push({ k: 'urgent', t: 'Registration hold', key: 'registrationHold' });
  if (s.academicConcern) f.push({ k: 'watch', t: 'Academic concern', key: 'academicConcern' });
  if (s.scholarshipCheck) f.push({ k: 'watch', t: 'Scholarship check', key: 'scholarshipCheck' });
  if (s.otherFlag) f.push({ k: 'watch', t: s.otherFlag, key: 'otherFlag' });
  return f;
}
function priorityRank(e) { return e.priority === 'urgent' ? 0 : e.priority === 'watch' ? 1 : 2; }
const AUDIT_TONE = { 'ahead': 'ok', 'on track': 'ok', 'complete': 'ok', 'needs review': 'watch', 'delayed': 'urgent', 'incomplete': 'urgent' };
function auditTone(s) { return AUDIT_TONE[String(s.auditStatus || '').toLowerCase().trim()] || ''; }

async function save(msg) {
  await Vault.persist();
  paintStatus();
  if (msg) toast(msg, 'good');
}

/* ─── curriculum templates ──────────────────────────────── */
function allTemplates() { return Object.assign({}, TPL, D().templates || {}); }
function templateOf(s) { return s.program ? allTemplates()[s.program] : null; }
function curriculumProgress(s) {
  const t = templateOf(s); if (!t) return null;
  const done = s.curriculum.done || {}, gbd = s.curriculum.gbd || {};
  const reqTotal = t.requirements.length, reqDone = t.requirements.filter(r => done[r.id]).length;
  const gbdList = (t.gbd || []).filter(g => !g.predone);
  const gbdDone = gbdList.filter(g => (gbd[g.id] || {}).done).length;
  const crDone = t.requirements.filter(r => done[r.id]).reduce((n, r) => n + (r.credits || 0), 0);
  const crTotal = t.requirements.reduce((n, r) => n + (r.credits || 0), 0);
  const elecDone = (s.curriculum.electives || []).reduce((n, e) => n + (parseFloat(e.cr) || 0), 0);
  const regMap = s.curriculum.reg || {};
  const regN = t.requirements.filter(r => regMap[r.id] && !done[r.id]).length;
  const total = reqTotal + gbdList.length, doneN = reqDone + gbdDone;
  return { reqTotal, reqDone, gbdTotal: gbdList.length, gbdDone, crDone, crTotal, elecDone, elecTotal: t.electiveCreditsRequired || 0, total, doneN, regN, pct: total ? doneN / total * 100 : 0, regPct: total ? (doneN + regN) / total * 100 : 0 };
}

/* ═══ RAIL ═══════════════════════════════════════════════ */
function paintRail() {
  const all = students().filter(s => !s.archived);
  const flagged = flagRows(all);
  const urgentN = flagged.filter(f => f.tone === 'urgent').length;

  $('#nav').innerHTML = [
    ['dash', 'Dashboard', flagged.length, urgentN > 0],
    ['students', 'Advisees', all.length, false],
    ['data', 'Backup &amp; data', null, false],
  ].map(([v, label, n, hot]) =>
    `<button data-nav="${v}" class="${S.view === v ? 'on' : ''}">${label}${n != null ? `<span class="n-count${hot ? ' hot' : ''}">${n}</span>` : ''}</button>`
  ).join('');
}

function paintStatus() {
  const el = $('#saved');
  const n = Vault.dirty;
  const linked = Vault.fileLinked;
  let cls = 'saved', txt;
  if (linked) { txt = n === 0 ? 'Saved to file' : 'Saving to file…'; }
  else if (n === 0) txt = 'Backed up';
  else { txt = `${n} change${n > 1 ? 's' : ''} since backup`; cls += n > 25 ? ' stale' : ' dirty'; }
  el.className = cls;
  el.innerHTML = `<span class="dot ${linked ? '' : (n > 25 ? 'warn' : n ? 'warn' : '')}"></span>${esc(txt)}`;
  $('#rail-status').innerHTML = `<span class="dot ${linked ? '' : 'off'}"></span>${linked ? 'File linked' : 'This browser only'}`;
  paintRail();
}

/* ═══ SEARCH ═════════════════════════════════════════════ */
function searchAll(q) {
  const needle = q.toLowerCase().trim();
  if (!needle) return [];
  const terms = needle.split(/\s+/);
  const hits = [];
  students().forEach(s => {
    const idText = [s.last, s.first, s.sid, s.classYear, s.careerAmbition, s.preferredEmail, s.track, s.generalNotes, s.otherFlag].filter(Boolean).join(' ');
    if (terms.every(t => idText.toLowerCase().includes(t)))
      hits.push({ s, kind: 'student', score: 0, snippet: [s.classYear, s.careerAmbition, s.preferredEmail].filter(Boolean).join(' · ') });
    (s.entries || []).forEach(e => {
      const body = stripHtml(e.body);
      const hay = [e.title, e.subject, e.from, e.to, e.topics, e.actionItems, e.meetingType, body].filter(Boolean).join(' ');
      const low = hay.toLowerCase();
      if (terms.every(t => low.includes(t))) {
        const i = low.indexOf(terms[0]);
        const start = Math.max(0, i - 60);
        hits.push({ s, e, kind: e.type, score: 1, snippet: (start ? '…' : '') + hay.slice(start, start + 220) + (hay.length > start + 220 ? '…' : '') });
      }
    });
    (s.plan || []).forEach(sem => (sem.courses || []).forEach(c => {
      const hay = [sem.label, c.code, c.title].filter(Boolean).join(' ');
      if (terms.every(t => hay.toLowerCase().includes(t))) hits.push({ s, kind: 'plan', score: 2, snippet: `${sem.label}: ${c.code} ${c.title}` });
    }));
  });
  return hits.sort((a, b) => a.score - b.score || sortName(a.s).localeCompare(sortName(b.s))).slice(0, 80);
}
function mark(text, q) {
  const terms = q.trim().split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  let out = esc(text);
  terms.forEach(t => { out = out.replace(new RegExp('(' + t + ')', 'ig'), '<mark>$1</mark>'); });
  return out;
}
function renderSearch(p) {
  const hits = searchAll(S.q);
  p.innerHTML = `<div class="page-head"><div><div class="eyebrow">${hits.length} result${hits.length === 1 ? '' : 's'}</div><h1>“${esc(S.q)}”</h1></div></div>
  ${hits.length ? hits.map(h => `<button class="res" data-open="${h.s.id}"${h.e ? ` data-entry="${h.e.id}"` : ''}>
    <div class="res-top"><span class="res-who">${esc(h.s.last)}, ${esc(h.s.first)}</span>
    <span class="chip ${h.kind === 'flag' ? 'urgent' : h.kind === 'student' ? 'accent' : ''}">${esc(h.kind === 'student' ? 'Profile' : h.kind === 'plan' ? 'Plan' : typeLabel(h.kind))}</span>
    ${h.e && h.e.date ? `<span class="mono sub">${esc(fmtDate(h.e.date))}</span>` : ''}
    ${h.e && h.e.title ? `<span class="sub" style="font-size:12.5px">${esc(h.e.title)}</span>` : ''}</div>
    <div class="res-snip">${mark(h.snippet || '', S.q)}</div></button>`).join('')
      : `<div class="empty"><h3>No matches</h3><p>Nothing in your records mentions that.</p></div>`}`;
}

function eventHtml(s, e) {
  const tone = entryTone(e);
  const pcls = e.status === 'done' && tone ? 'p-done' : tone === 'urgent' ? 'p-urgent' : tone === 'watch' ? 'p-watch' : '';
  const dt = e.date ? new Date(e.date + (e.date.length === 10 ? 'T12:00:00' : '')) : null;
  const fields = [];
  if (e.type === 'meeting') {
    if (e.meetingType) fields.push(['Type', e.meetingType]);
    if (e.followUpBy) fields.push(['Follow up by', fmtDate(e.followUpBy)]);
    if (e.actionItems) fields.push(['Action items', e.actionItems]);
  }
  if (e.type === 'email') {
    if (e.from) fields.push(['From', e.from]);
    if (e.to) fields.push(['To', e.to]);
  }
  if (e.dueDate) fields.push(['Due', fmtDate(e.dueDate)]);
  const bodyHtml = e.body || '';
  const long = stripHtml(bodyHtml).length > 700;
  return `<div class="ev ${pcls}" id="ev-${e.id}">
    <div class="ev-date">${dt ? esc(dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) : '—'}<span class="yr">${dt ? dt.getFullYear() : ''}</span></div>
    <div class="ev-card">
      <div class="ev-top">
        <span class="chip ${e.type === 'flag' ? 'urgent' : e.type === 'email' ? 'accent' : ''}">${esc(typeLabel(e.type))}</span>
        <span class="ev-title">${esc(e.title || e.subject || '(untitled)')}</span>
        ${tone ? `<span class="chip ${tone}">${e.status === 'done' ? 'resolved' : (e.priority && e.priority !== 'none' ? e.priority : 'flagged')}</span>` : ''}
        ${e.status === 'done' ? '<span class="chip ok">done</span>' : ''}

  </div><div class="ed-area" id="${id}" contenteditable="true" data-ph="${esc(ph)}">${html || ''}</div></div>`;

function wireEditor(root) {
  const area = $('.ed-area', root); if (!area) return;
  $$('.ed-bar button', root).forEach(b => b.onmousedown = e => {
    e.preventDefault();
    area.focus();
    if (b.hasAttribute('data-table')) {
      const rows = +prompt('How many rows?', '4') || 0, cols = +prompt('How many columns?', '3') || 0;
      if (!rows || !cols) return;
      let t = '<table>';
      for (let r = 0; r < rows; r++) { t += '<tr>'; for (let c = 0; c < cols; c++) t += r === 0 ? '<th>&nbsp;</th>' : '<td>&nbsp;</td>'; t += '</tr>'; }
      document.execCommand('insertHTML', false, t + '</table><p></p>');
      return;
    }
    const cmd = b.dataset.cmd;
    if (cmd === 'createLink') { const u = prompt('Link address'); if (u) document.execCommand('createLink', false, u); return; }
    document.execCommand(cmd, false, b.dataset.val || null);
  });
  area.addEventListener('paste', ev => {
    const dt = ev.clipboardData; if (!dt) return;
    const img = Array.from(dt.items || []).find(i => i.type.startsWith('image/'));
    if (img) {
      ev.preventDefault();
      const f = img.getAsFile(); const r = new FileReader();
      r.onload = () => document.execCommand('insertHTML', false, `<img src="${r.result}">`);
      r.readAsDataURL(f); return;
    }
    const html = dt.getData('text/html');
    if (html) { ev.preventDefault(); document.execCommand('insertHTML', false, cleanHtml(html)); }
  });
}

/* ─── Email drop ────────────────────────────────────────── */
function wireDrop(zone, s) {
  if (!zone) return;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  ['dragenter', 'dragover'].forEach(k => zone.addEventListener(k, e => { stop(e); zone.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(k => zone.addEventListener(k, e => { stop(e); zone.classList.remove('over'); }));
  zone.addEventListener('drop', async e => {
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return toast('Outlook did not hand over a file. Try dragging the message to your desktop first, then in here.', 'bad');
    let n = 0;
    for (const f of files) {
      try { await ingestEmail(s, f); n++; }
      catch (err) { toast(`Could not read ${f.name}: ${err.message}`, 'bad'); }
    }
    if (n) { await save(); render(); toast(`${n} email${n > 1 ? 's' : ''} added to the record`, 'good'); }
  });
}
async function ingestEmail(s, file) {
  const nm = file.name.toLowerCase();
  let m;
  if (nm.endsWith('.msg')) m = parseMsg(await file.arrayBuffer());
  else if (nm.endsWith('.eml') || nm.endsWith('.txt')) m = parseEml(await file.text());
  else throw new Error('not an email file (.msg or .eml)');
  const body = m.html ? cleanHtml(m.html) : textToHtml(m.text);
  (s.entries = s.entries || []).push({
    id: uid(), type: 'email', date: (m.date || new Date().toISOString()).slice(0, 10),
    title: m.subject || '(no subject)', from: m.from || '', to: m.to || '',
    body, attachments: (m.attachments || []).map(a => ({ name: a.name, type: a.type })),
    priority: 'none', status: 'open', createdAt: new Date().toISOString(), source: file.name,
  });
}

/* ─── Priority tab: only what's flagged ─────────────────── */
function renderPriorityTab(body, s) {
  const flagged = (s.entries || []).filter(e => entryTone(e));
  const rank = e => (e.priority === 'urgent' ? 0 : 1);
  const openList = flagged.filter(e => e.status !== 'done')
    .sort((a, b) => rank(a) - rank(b) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || (b.date || '').localeCompare(a.date || ''));
  const doneList = flagged.filter(e => e.status === 'done')
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const overdue = openList.filter(e => e.dueDate && e.dueDate <= today()).length;

  if (!flagged.length) {
    body.innerHTML = `<div class="empty"><h3>Nothing flagged for ${esc(fullName(s))}</h3>
      <p>Anything you mark Watch or Urgent — a note, an email, a meeting, a flag — collects here, newest concern first.</p>

    return;

  body.innerHTML = `
    <div class="filters no-print">
      <span class="chips">
        ${openList.filter(e => e.priority === 'urgent').length ? `<span class="chip urgent">${openList.filter(e => e.priority === 'urgent').length} urgent</span>` : ''}
        ${openList.filter(e => e.priority !== 'urgent').length ? `<span class="chip watch">${openList.filter(e => e.priority !== 'urgent').length} watch</span>` : ''}

      <div class="spine" style="opacity:.72">${doneList.map(e => eventHtml(s, e)).join('')}</div>` : ''}`;
}

/* ═══ IMPORT: Excel roster ═══════════════════════════════ */
const FIELD_MAP = [
  ['last', 'Last name'], ['first', 'First name'], ['sid', 'Student ID'], ['classYear', 'Class year'],
  ['program', 'Program'], ['track', 'Track / concentration'], ['minor', 'Minor'], ['careerAmbition', 'Career ambition'],
  ['preferredEmail', 'Preferred email'], ['creditsEarned', 'Credits earned'], ['creditsRemaining', 'Credits remaining'],
  ['auditStatus', 'Degree audit status'], ['planLastThree', 'Last-three plan'], ['registrationHold', 'Registration hold'],
  ['academicConcern', 'Academic concern'], ['scholarshipCheck', 'Scholarship check'], ['otherFlag', 'Other flag'],
  ['oneNoteLink', 'OneNote link'], ['worksheetsDir', 'Worksheets folder'], ['generalNotes', 'General notes'],
  ['_lastMeeting', 'Last meeting date → logs a meeting'], ['_meetingCount', 'Total meetings (noted)'],
];
const GUESS = {
  last: /^last/i, first: /^first/i, sid: /student\s*id|^id$/i, classYear: /class\s*year|^year$/i,
  program: /^major|program|track$/i, minor: /minor/i, careerAmbition: /career|ambition/i, preferredEmail: /email/i,
  creditsEarned: /credits?\s*earned/i, creditsRemaining: /credits?\s*remain/i, auditStatus: /audit/i,
  planLastThree: /last\s*three/i, registrationHold: /hold/i, academicConcern: /concern/i,
  scholarshipCheck: /scholarship/i, otherFlag: /other\s*flag/i, oneNoteLink: /onenote/i,
  worksheetsDir: /worksheet|directory/i, generalNotes: /notes/i,
  _lastMeeting: /last\s*meeting/i, _meetingCount: /total\s*meetings/i,
};
const truthy = v => /^(y|yes|true|1|x|✓)$/i.test(String(v).trim());

async function importXlsxFlow() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xlsm';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let sheets;
    try { sheets = await readXlsx(f); }
    catch (e) { return toast(e.message, 'bad'); }
    sheets = sheets.filter(s => s.rows.some(r => r.filter(Boolean).length > 1));
    if (!sheets.length) return toast('That workbook has no rows with data in it.', 'bad');
    pickSheet(sheets);
  };
  inp.click();
}

function pickSheet(sheets) {
  modal({
    title: 'Import roster from Excel', wide: true,
    body: `<div class="field"><label>Which sheet holds your students?</label>
        <select id="i-sheet">${sheets.map((s, i) => `<option value="${i}">${esc(s.name)} — ${s.rows.length} rows</option>`).join('')}</select></div>
      <div class="field" style="margin-top:12px"><label>Which row has the column headings?</label><select id="i-head"></select></div>
      <div id="i-prev" style="margin-top:14px"></div>`,
    buttons: [{ label: 'Cancel' }, {
      label: 'Next: match columns', kind: 'pri', onClick: (bg, close) => {
        const sh = sheets[+$('#i-sheet', bg).value], hr = +$('#i-head', bg).value;
        close(); mapColumns(sh, hr);
      }
    }],
    onOpen: bg => {
      const fill = () => {
        const sh = sheets[+$('#i-sheet', bg).value];
        const opts = sh.rows.slice(0, 12).map((r, i) => `<option value="${i}">Row ${i + 1}: ${esc(r.filter(Boolean).slice(0, 5).join(' · ').slice(0, 70))}</option>`).join('');
        $('#i-head', bg).innerHTML = opts;
        // best guess: first row with 3+ non-empty cells that look like labels
        const guess = sh.rows.findIndex(r => r.filter(Boolean).length >= 3 && r.some(c => /last/i.test(c)));
        $('#i-head', bg).value = guess >= 0 ? guess : 0;
        preview(bg, sh, +$('#i-head', bg).value);
      };
      $('#i-sheet', bg).onchange = fill;
      $('#i-head', bg).onchange = () => preview(bg, sheets[+$('#i-sheet', bg).value], +$('#i-head', bg).value);
      fill();
    },
  });
  function preview(bg, sh, hr) {
    const head = sh.rows[hr] || [], rows = sh.rows.slice(hr + 1).filter(r => r.filter(Boolean).length);
    $('#i-prev', bg).innerHTML = `<div class="hint" style="margin-bottom:6px">${rows.length} data rows below that heading</div>
      <div class="t-wrap" style="overflow-x:auto"><table><thead><tr>${head.map(h => `<th>${esc(h || '')}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 3).map(r => `<tr>${head.map((_, i) => `<td class="sub">${esc((r[i] || '').slice(0, 26))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
}

function mapColumns(sheet, headRow) {
  const head = sheet.rows[headRow] || [];
  const rows = sheet.rows.slice(headRow + 1).filter(r => r.filter(Boolean).length);
  const auto = {};
  FIELD_MAP.forEach(([k]) => {
    const i = head.findIndex(h => GUESS[k] && GUESS[k].test(h || ''));
    if (i >= 0 && !Object.values(auto).includes(i)) auto[k] = i;
  });
  modal({
    title: 'Match your columns', wide: true,
    body: `<p class="hint" style="margin-bottom:14px">Anything left unmatched is skipped. Rows are matched to existing students by student ID, then by name — an import updates rather than duplicates.</p>
      <div class="fields">${FIELD_MAP.map(([k, label]) => `<div class="field"><label>${esc(label)}</label>
        <select data-map="${k}"><option value="">— skip —</option>
        ${head.map((h, i) => `<option value="${i}" ${auto[k] === i ? 'selected' : ''}>${esc(h || '(column ' + (i + 1) + ')')}</option>`).join('')}
        </select></div>`).join('')}</div>`,
    buttons: [{ label: 'Cancel' }, {
      label: `Import ${rows.length} rows`, kind: 'pri', onClick: async (bg, close) => {
        const map = {};
        $$('[data-map]', bg).forEach(sel => { if (sel.value !== '') map[sel.dataset.map] = +sel.value; });
        const res = applyImport(rows, map);
        close(); await save();
        toast(`${res.added} added, ${res.updated} updated${res.meetings ? `, ${res.meetings} meetings logged` : ''}`, 'good');
        go('students');
      }
    }],
  });
}

function applyImport(rows, map) {
  let added = 0, updated = 0, meetings = 0;
  const val = (r, k) => map[k] != null ? (r[map[k]] || '').trim() : '';
  rows.forEach(r => {
    const sid = val(r, 'sid'), last = val(r, 'last'), first = val(r, 'first');
    if (!sid && !last) return;
    let s = sid ? students().find(x => x.sid && x.sid === sid) : null;
    if (!s) s = students().find(x => x.last.toLowerCase() === last.toLowerCase() && x.first.toLowerCase() === first.toLowerCase() && last);
    if (!s) { s = newStudent(); students().push(s); added++; } else updated++;
    ['last', 'first', 'sid', 'classYear', 'track', 'minor', 'careerAmbition', 'preferredEmail', 'creditsEarned',
      'creditsRemaining', 'auditStatus', 'planLastThree', 'otherFlag', 'oneNoteLink', 'worksheetsDir'].forEach(k => {
        const v = val(r, k); if (v) s[k] = v;
      });
    ['registrationHold', 'academicConcern', 'scholarshipCheck'].forEach(k => { if (map[k] != null) s[k] = truthy(val(r, k)); });
    const notes = val(r, 'generalNotes'); if (notes) s.generalNotes = (s.generalNotes ? s.generalNotes + '\n' : '') + notes;
    const prog = val(r, 'program');
    if (prog && !s.program) {
      const keys = Object.entries(allTemplates()).find(([k, t]) => t.title.toLowerCase().includes(prog.toLowerCase()) || prog.toLowerCase().includes(k));
      s.program = keys ? keys[0] : s.program;
      if (!keys) s.track = s.track || prog;
    }
    const lm = val(r, '_lastMeeting');
    if (lm) {
      const d = /^\d{4}-\d{2}-\d{2}/.test(lm) ? lm.slice(0, 10) : (isNaN(new Date(lm)) ? null : new Date(lm).toISOString().slice(0, 10));
      if (d && !(s.entries || []).some(e => e.type === 'meeting' && e.date === d)) {
        (s.entries = s.entries || []).push({
          id: uid(), type: 'meeting', date: d, title: 'Advising meeting',
          body: `<p>Imported from the tracker spreadsheet.${val(r, '_meetingCount') ? ` Spreadsheet recorded ${esc(val(r, '_meetingCount'))} meetings total.` : ''}</p>`,
          priority: 'none', status: 'open', createdAt: new Date().toISOString(),
        });
        meetings++;
      }
    }
  });
  return { added, updated, meetings };
}

/* ═══ IMPORT: OneNote paste ══════════════════════════════ */
function oneNoteFlow(preStudent) {
  if (!students().length) return toast('Add a student first — a page has to land on someone.', 'bad');

  modal({
    title: 'Paste a OneNote page', wide: true, sticky: true,
    body: `<p class="hint" style="margin-bottom:12px">In OneNote: open the page, Ctrl+A, Ctrl+C, then paste below. Tables, highlighting and images come across. Do this once per page — it lands on that student's record as a dated entry.</p>
      <div class="fields">
        <div class="field"><label>Student</label><select id="on-student">${list.map(s => `<option value="${s.id}" ${preStudent === s.id ? 'selected' : ''}>${esc(s.last)}, ${esc(s.first)}</option>`).join('')}</select></div>
        <div class="field"><label>Kind</label><select id="on-type">${['note', 'meeting', 'email', 'flag'].map(t => `<option value="${t}">${typeLabel(t)}</option>`).join('')}</select></div>
        <div class="field"><label>Date on the page</label><input type="date" id="on-date" value="${today()}"></div>
        <div class="field"><label>Title</label><input id="on-title" placeholder="Meeting notes"></div>
        <div class="field wide"><label>Paste here</label>${editorHtml('on-body', 'Paste the OneNote page…', '')}</div>
      </div>`,
    buttons: [{ label: 'Cancel' }, {
      label: 'Add to record', kind: 'pri', onClick: async (bg, close) => {
        const s = getStudent($('#on-student', bg).value);

        if (S.view === 'student') render();
      }
    }],
    onOpen: bg => wireEditor(bg),
  });
}

/* ═══ EXPORTS ════════════════════════════════════════════ */
function exportCsv() {
  const cols = ['last', 'first', 'sid', 'classYear', 'program', 'track', 'minor', 'careerAmbition', 'preferredEmail',
    'creditsEarned', 'creditsRemaining', 'auditStatus', 'planLastThree', 'registrationHold', 'academicConcern',
    'scholarshipCheck', 'otherFlag', 'generalNotes'];
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const head = [...cols, 'lastMeeting', 'meetings', 'openFlags'].join(',');
  const body = students().map(s => [...cols.map(c => q(typeof s[c] === 'boolean' ? (s[c] ? 'Yes' : 'No') : s[c])),
  q(lastMeeting(s) || ''), q(entries(s, 'meeting').length), q(openItems(s).length)].join(',')).join('\n');
  download(new Blob([head + '\n' + body], { type: 'text/csv' }), `advising-roster-${today()}.csv`);
}
function exportPlain() {
  confirmBox('Export unencrypted', 'This writes a readable file containing every student record, note and email on your machine. It is not protected by your passcode. Save it somewhere you would be comfortable storing a printed advising file.', 'Export anyway', () => {
    const payload = { app: APP, kind: 'plain-export', schema: APP_VER, exportedAt: new Date().toISOString(), rev: Vault.meta.rev, deviceId: Vault.deviceId, data: D() };
    download(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }), `advising-hub-PLAIN-${today()}.json`);
  }, 'danger');
}

/* ═══ RESTORE / MERGE GUARD ══════════════════════════════ */
function restoreFlow() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.hub,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let peek;
    try { peek = JSON.parse(await f.text()); }
    catch (e) { return toast(`${f.name} is not readable as a backup — pick the file you downloaded from Backup & data.`, 'bad'); }
    if (peek.app !== APP) return toast(`${f.name} is not an Advising Hub backup.`, 'bad');
    const encrypted = peek.kind !== 'plain-export';
    modal({
      title: 'Restore from a backup',
      body: `${compareHtml(peek)}
        ${encrypted ? `<div class="field" style="margin-top:14px"><label>Passcode for that backup</label><input type="password" id="r-pass" placeholder="Passcode used when it was made"></div>` : ''}
        <p class="hint" style="margin-top:12px">Restoring replaces what is in this browser. A copy of your current data downloads first, so nothing is lost either way.</p>`,
      buttons: [{ label: 'Cancel' }, {
        label: 'Replace with this backup', kind: 'danger', onClick: async (bg, close) => {
          try {
            const pass = encrypted ? $('#r-pass', bg).value : null;
            const { payload, data } = await Vault.openBackup(f, pass);
            await Vault.downloadBackup();
            await Vault.replaceData(data, payload);
            close(); paintStatus(); go('dash');
            toast(`Restored ${data.students.length} students`, 'good');
          } catch (e) { toast(encrypted ? 'That passcode does not open this backup.' : e.message, 'bad'); }
        }
      }],
    });
  };
  inp.click();
}
function compareHtml(peek) {
  const mine = { students: students().length, entries: students().reduce((n, s) => n + (s.entries || []).length, 0), rev: Vault.meta.rev, when: Vault.meta.updatedAt };
  const theirs = { students: (peek.counts || {}).students != null ? peek.counts.students : (peek.data ? peek.data.students.length : '?'), entries: (peek.counts || {}).entries != null ? peek.counts.entries : '?', rev: peek.rev, when: peek.updatedAt || peek.exportedAt };
  const older = peek.rev != null && Vault.meta.rev != null && peek.rev < Vault.meta.rev;
  const sameDevice = peek.deviceId === Vault.deviceId;
  return `<div class="t-wrap"><table><thead><tr><th></th><th>In this browser</th><th>In the backup file</th></tr></thead><tbody>
    <tr><td class="sub">Students</td><td class="mono">${mine.students}</td><td class="mono">${theirs.students}</td></tr>
    <tr><td class="sub">Record entries</td><td class="mono">${mine.entries}</td><td class="mono">${theirs.entries}</td></tr>
    <tr><td class="sub">Last change</td><td class="mono">${esc(fmtDate(mine.when, 'time'))}</td><td class="mono">${esc(fmtDate(theirs.when, 'time'))}</td></tr>
    <tr><td class="sub">Revision</td><td class="mono">${mine.rev}</td><td class="mono">${theirs.rev != null ? theirs.rev : '—'}</td></tr>
  </tbody></table></div>
  ${older ? `<p style="margin-top:12px;color:var(--urgent);font-size:13px;line-height:1.6"><b>This backup is behind what's in this browser.</b> ${sameDevice ? '' : 'It was last written on a different machine. '}Restoring it will drop the newer changes here.</p>` : ''}`;
}

/* ═══ FILE SYNC ══════════════════════════════════════════ */
async function fileLoadFlow() {
  try {
    const payload = await Vault.readLinkedFile();
    if (!payload) return toast('Could not read the linked file.', 'bad');
    if (payload.rev != null && Vault.meta.rev != null && payload.rev < Vault.meta.rev && payload.deviceId !== Vault.deviceId) {
      return confirmBox('The file is behind this browser',
        `The linked file is at revision ${payload.rev}; this browser is at ${Vault.meta.rev}. Loading it will drop newer changes made here.`,
        'Load it anyway', () => doFileLoad(payload), 'danger');
    }
    doFileLoad(payload);
  } catch (e) { toast(e.message, 'bad'); }
}
async function doFileLoad(payload) {
  modal({
    title: 'Load from the linked file',
    body: `<div class="field"><label>Passcode that file was written with</label><input type="password" id="fl-pass" placeholder="Usually the same as this one"></div>`,
    buttons: [{ label: 'Cancel' }, {
      label: 'Load', kind: 'pri', onClick: async (bg, close) => {
        try {
          const key = await Crypt.deriveKey($('#fl-pass', bg).value, b64d(payload.kdf.salt), payload.kdf.iters);
          const data = await Crypt.decrypt(key, payload.iv, payload.ct);
          await Vault.replaceData(data, payload);
          close(); paintStatus(); go('dash'); toast('Loaded from the linked file', 'good');
        } catch (e) { toast('That passcode does not open the file.', 'bad'); }
      }
    }],
  });
}
